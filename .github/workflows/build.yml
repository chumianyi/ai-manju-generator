name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK (arm64-v8a release)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --split-per-abi \
            --no-tree-shake-icons

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk/
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv app-arm64-v8a-release.apk AI-Manju-Generator-v1.0.0-arm64-v8a.apk
          fi
          ls -la

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Manju-Generator-APK
          path: build/app/outputs/flutter-apk/AI-Manju-Generator-v1.0.0-arm64-v8a.apk
          retention-days: 30
